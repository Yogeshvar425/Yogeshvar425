<svg fill="none" viewBox="0 0 850 220" width="850" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#titleGrad);
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #cbd5e1;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-weight: 600;
      font-size: 11.5px;
      fill: #38bdf8;
    }
    .location {
      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      fill: #64748b;
    }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="846" height="216" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="846" height="216" rx="18" fill="url(#grid)"/>
  <rect x="2" y="2" width="846" height="216" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Glow -->
  <circle cx="90" cy="50" r="70" fill="#38bdf8" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="760" cy="160" r="80" fill="#a855f7" fill-opacity="0.1" filter="url(#glow)"/>

  <!-- Name -->
  <text x="425" y="72" text-anchor="middle" class="title">V S YOGESHVAR</text>

  <!-- Tagline -->
  <text x="425" y="108" text-anchor="middle" class="subtitle">Edge AI • Embedded Systems • Computer Vision • Software Engineering</text>
  <text x="425" y="130" text-anchor="middle" class="location">B.Tech CSE @ Dayananda Sagar University ('27) • Bengaluru, India</text>

  <!-- Tags -->
  <g transform="translate(75, 154)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="150" height="32" rx="16" fill="url(#chipGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="75" y="20" text-anchor="middle" class="tag-text"># NVIDIA Jetson</text>

    <!-- Tag 2 -->
    <rect x="165" y="0" width="160" height="32" rx="16" fill="url(#chipGrad)" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="245" y="20" text-anchor="middle" class="tag-text"># TensorRT &amp; YOLOv8</text>

    <!-- Tag 3 -->
    <rect x="340" y="0" width="165" height="32" rx="16" fill="url(#chipGrad)" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1"/>
    <text x="422" y="20" text-anchor="middle" class="tag-text"># Local LLM / llama.cpp</text>

    <!-- Tag 4 -->
    <rect x="520" y="0" width="180" height="32" rx="16" fill="url(#chipGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="610" y="20" text-anchor="middle" class="tag-text"># FastAPI &amp; Systems</text>
  </g>
</svg>
