<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#textGrad);
      letter-spacing: 1.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: 'Fira Code', 'Courier New', Courier, monospace;
      font-weight: 600;
      font-size: 11px;
      fill: #38bdf8;
    }
  </style>

  <!-- Card Background with subtle border and grid -->
  <rect x="2" y="2" width="796" height="196" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="796" height="196" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="796" height="196" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Decorative Glow Spots -->
  <circle cx="100" cy="50" r="60" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="140" r="70" fill="#a855f7" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Main Title -->
  <text x="400" y="75" text-anchor="middle" class="title">V S YOGESHVAR</text>

  <!-- Subtitle -->
  <text x="400" y="112" text-anchor="middle" class="subtitle">CSE Student @ DSU '27 • Agentic AI &amp; Computer Vision • Systems Engineering</text>

  <!-- Tags / Highlights -->
  <g transform="translate(145, 140)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="115" height="28" rx="14" fill="url(#chipGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="57" y="18" text-anchor="middle" class="tag-text"># Agentic AI</text>

    <!-- Tag 2 -->
    <rect x="125" y="0" width="125" height="28" rx="14" fill="url(#chipGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="187" y="18" text-anchor="middle" class="tag-text"># Edge AI (YOLO)</text>

    <!-- Tag 3 -->
    <rect x="260" y="0" width="110" height="28" rx="14" fill="url(#chipGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="315" y="18" text-anchor="middle" class="tag-text"># C / C++ Dev</text>

    <!-- Tag 4 -->
    <rect x="380" y="0" width="130" height="28" rx="14" fill="url(#chipGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="445" y="18" text-anchor="middle" class="tag-text"># DSA &amp; Systems</text>
  </g>
</svg>
