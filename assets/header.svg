<svg fill="none" viewBox="0 0 850 180" width="850" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .name { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #f1f5f9; letter-spacing: -1px; }
    .role { font-family: 'Segoe UI', sans-serif; font-weight: 500; font-size: 16px; fill: #64748b; letter-spacing: 0.5px; }
    .highlight { fill: #38bdf8; }
    .tag { font-family: 'Segoe UI', sans-serif; font-size: 11.5px; fill: #94a3b8; }
    .dot { fill: #22c55e; }
    .dot-amber { fill: #f59e0b; }
  </style>

  <!-- Background -->
  <rect width="850" height="180" rx="12" fill="url(#bg)"/>
  <rect width="850" height="180" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="180" rx="0" fill="url(#accent)"/>

  <!-- Subtle horizontal glow band -->
  <rect x="4" y="60" width="400" height="50" rx="0" fill="url(#fade)"/>

  <!-- Name -->
  <text x="36" y="100" class="name">Yogeshvar</text>

  <!-- Role line -->
  <text x="38" y="128" class="role">Software <tspan class="highlight">×</tspan> AI/ML Engineer</text>

  <!-- Status row -->
  <circle cx="44" cy="156" r="4" class="dot"/>
  <text x="56" y="160" class="tag">CSE · DSU '27 · Bengaluru</text>
  <circle cx="244" cy="156" r="4" class="dot-amber"/>
  <text x="256" y="160" class="tag">Open to internships</text>

  <!-- Right-side vertical metrics -->
  <text x="810" y="48" text-anchor="end" class="tag" style="font-size:10px; fill:#475569;">SYSTEMS</text>
  <text x="810" y="72" text-anchor="end" style="font-family:'Segoe UI',sans-serif; font-size:32px; font-weight:800; fill:#e2e8f0;">3</text>
  <text x="810" y="92" text-anchor="end" class="tag" style="font-size:10px;">2 shipped · 1 active</text>

  <line x1="740" y1="108" x2="810" y2="108" stroke="#1e293b" stroke-width="1"/>

  <text x="810" y="128" text-anchor="end" class="tag" style="font-size:10px; fill:#475569;">FOCUS</text>
  <text x="810" y="150" text-anchor="end" class="tag" style="font-size:11px; fill:#94a3b8;">Edge AI · Vision · NLP</text>
</svg>
